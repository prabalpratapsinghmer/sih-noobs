[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sih26184"
version = "1.0.0"
description = "Predictive Analytics Framework for Cybercrime Complaints"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "SIH Team", email = "team@sih.gov.in"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/sih26184/cybercrime-prediction"
Documentation = "https://github.com/sih26184/cybercrime-prediction/blob/main/docs/API.md"

[project.scripts]
sih-train-atm = "models.spatio_temporal.train:main"
sih-train-mule = "models.mule_detection.train:main"
sih-serve = "api.main:main"
sih-synthesize = "models.utils.data_synthesis:main"

[tool.setuptools.packages.find]
include = ["models*", "api*", "config*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gpu: marks tests that require GPU",
    "integration: marks integration tests",
    "asyncio: marks asyncio tests",
    "anyio: marks anyio async tests",
]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

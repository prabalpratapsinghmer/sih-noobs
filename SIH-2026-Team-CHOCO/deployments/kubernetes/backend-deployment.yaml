apiVersion: apps/v1
kind: Deployment
metadata:
  name: sih-backend
  labels:
    app: sih-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sih-backend
  template:
    metadata:
      labels:
        app: sih-backend
    spec:
      containers:
        - name: backend
          image: sih26184-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          envFrom:
            - configMapRef:
                name: sih-backend-config
            - secretRef:
                name: sih-backend-secrets
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 40
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
# ============================================================================
# SIH26184 — Kubernetes ConfigMap
# ============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: sih26184-config
  namespace: sih26184
  labels:
    app: sih26184
data:
  ENVIRONMENT: "production"
  API_HOST: "0.0.0.0"
  API_PORT: "8000"
  API_WORKERS: "4"

  # Database
  POSTGRES_HOST: "sih26184-postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "sih26184"

  # Neo4j
  NEO4J_URI: "bolt://sih26184-neo4j:7687"
  NEO4J_DATABASE: "neo4j"

  # Redis
  REDIS_HOST: "sih26184-redis"
  REDIS_PORT: "6379"
  REDIS_DB: "0"

  # MLflow
  MLFLOW_TRACKING_URI: "http://sih26184-mlflow:5000"

  # Logging
  LOG_LEVEL: "INFO"
  LOG_FORMAT: "{time:YYYY-MM-DD HH:mm:ss} | {level} | {name} | {message}"

  # Monitoring
  PROMETHEUS_PORT: "9090"

# ============================================================================
# SIH26184 — Kubernetes Deployment
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sih26184-api
  namespace: sih26184
  labels:
    app: sih26184-api
    component: prediction-api
    version: "1.0.0"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: sih26184-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: sih26184-api
        component: prediction-api
    spec:
      containers:
        - name: api
          image: sih26184/prediction-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              protocol: TCP
              name: http
          envFrom:
            - configMapRef:
                name: sih26184-config
            - secretRef:
                name: sih26184-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
              # Uncomment for GPU:
              # nvidia.com/gpu: "1"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          volumeMounts:
            - name: model-storage
              mountPath: /app/models
              readOnly: true
            - name: data-storage
              mountPath: /app/data
      volumes:
        - name: model-storage
          persistentVolumeClaim:
            claimName: sih26184-models-pvc
        - name: data-storage
          persistentVolumeClaim:
            claimName: sih26184-data-pvc
      # Pod anti-affinity: spread across nodes
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - sih26184-api
                topologyKey: kubernetes.io/hostname

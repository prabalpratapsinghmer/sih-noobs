# Prometheus scrape config for SIH26184.
# Job layout:
#   - backend:        the FastAPI app's own /metrics (required)
#   - node-exporter:  host metrics (add the node-exporter service to compose to enable)
# Exporter jobs below are COMMENTED OUT because the exporter services are not
# shipped in docker-compose.yml by default — uncomment + add the service to
# enable per-DB metrics:
#   - postgres-exporter (prometheuscommunity/postgres-exporter) on :9187
#   - redis-exporter (oliver006/redis_exporter) on :9121
#   - neo4j-exporter (neo4j-exporter, custom) on :2004
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]


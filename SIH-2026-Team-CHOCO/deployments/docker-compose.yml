# ============================================================================
# SIH26184 — Local Development Stack
# ============================================================================
# Usage:
#   docker-compose up -d              # Start all services
#   docker-compose up -d api          # Start API only
#   docker-compose logs -f api        # Follow API logs
#   docker-compose down               # Stop all services
# ============================================================================


services:
  # --------------------------------------------------------------------------
  # Prediction API
  # --------------------------------------------------------------------------
  api:
    build:
      context: ..
      dockerfile: deployments/docker/Dockerfile
    container_name: sih26184-api
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=sih26184
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=devpassword
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=devpassword
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    volumes:
      - ../../data:/app/data
      - ../../models:/app/models
      - ../../logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - sih-network

  # --------------------------------------------------------------------------
  # Banking Mock API
  # --------------------------------------------------------------------------
  banking-mock:
    build:
      context: ..
      dockerfile: deployments/docker/Dockerfile
    container_name: sih26184-banking-mock
    command: ["uvicorn", "api.banking_mock:app", "--host", "0.0.0.0", "--port", "8001"]
    ports:
      - "8001:8001"
    restart: unless-stopped
    networks:
      - sih-network

  # --------------------------------------------------------------------------
  # PostgreSQL
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: sih26184-postgres
    environment:
      POSTGRES_DB: sih26184
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: devpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - sih-network

  # --------------------------------------------------------------------------
  # Neo4j Graph Database
  # --------------------------------------------------------------------------
  neo4j:
    image: neo4j:5-community
    container_name: sih26184-neo4j
    environment:
      NEO4J_AUTH: neo4j/devpassword
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"   # HTTP browser
      - "7687:7687"   # Bolt protocol
    volumes:
      - neo4j_data:/data
    restart: unless-stopped
    networks:
      - sih-network

  # --------------------------------------------------------------------------
  # Redis Cache
  # --------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: sih26184-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - sih-network

  # --------------------------------------------------------------------------
  # MLflow Tracking Server
  # --------------------------------------------------------------------------
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.9.0
    container_name: sih26184-mlflow
    command: >
      mlflow server
        --host 0.0.0.0
        --port 5000
        --backend-store-uri sqlite:///mlflow.db
        --default-artifact-root /mlflow/artifacts
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow
    restart: unless-stopped
    networks:
      - sih-network

  # --------------------------------------------------------------------------
  # Streamlit Dashboard
  # --------------------------------------------------------------------------
  dashboard:
    build:
      context: ..
      dockerfile: deployments/docker/Dockerfile
    container_name: sih26184-dashboard
    command: ["streamlit", "run", "dashboard/streamlit_dashboard.py", "--server.port", "8501", "--server.address", "0.0.0.0"]
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://api:8000
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - sih-network

  # --------------------------------------------------------------------------
  # Frontend: Admin Panel
  # --------------------------------------------------------------------------
  admin-panel:
    build:
      context: ../
      dockerfile: deployments/docker/Dockerfile.frontend
      args:
        APP_NAME: admin-panel
    container_name: sih26184-admin-panel
    ports:
      - "3001:80"
    restart: unless-stopped
    networks:
      - sih-network

  # --------------------------------------------------------------------------
  # Frontend: Field Dashboard
  # --------------------------------------------------------------------------
  field-dashboard:
    build:
      context: ../
      dockerfile: deployments/docker/Dockerfile.frontend
      args:
        APP_NAME: field-dashboard
    container_name: sih26184-field-dashboard
    ports:
      - "3002:80"
    restart: unless-stopped
    networks:
      - sih-network

  # --------------------------------------------------------------------------
  # Frontend: Command Center
  # --------------------------------------------------------------------------
  command-center:
    build:
      context: ../
      dockerfile: deployments/docker/Dockerfile.frontend
      args:
        APP_NAME: command-center
    container_name: sih26184-command-center
    ports:
      - "3003:80"
    restart: unless-stopped
    networks:
      - sih-network

volumes:
  postgres_data:
  neo4j_data:
  redis_data:
  mlflow_data:

networks:
  sih-network:
    driver: bridge


<!-- Template: system_alert (admin recipients)
     Variables: {message}
     Rendered by api/services/notifications.py render("system_alert", message=...) -->
<!DOCTYPE html>
<html lang="en">
<body style="font-family: Arial, Helvetica, sans-serif; background: #f4f6f8; margin: 0; padding: 24px;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
    <tr>
      <td align="center">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0"
               style="background: #ffffff; border-radius: 8px; overflow: hidden;
                      box-shadow: 0 2px 8px rgba(0,0,0,0.08);">
          <tr>
            <td style="background: #78350f; color: #ffffff; padding: 20px 28px;">
              <h1 style="margin: 0; font-size: 20px;">⚠️ System Alert</h1>
            </td>
          </tr>
          <tr>
            <td style="padding: 28px; color: #333333; font-size: 14px; line-height: 1.6;">
              <p>Admin,</p>
              <p style="background: #fffbeb; border-left: 4px solid #d97706; padding: 12px 16px;">
                {message}
              </p>
              <p style="margin-bottom: 0;">— CyberCell, SIH26184 Predictive Analytics Framework</p>
            </td>
          </tr>
          <tr>
            <td style="background: #f8fafc; padding: 12px 28px; color: #64748b; font-size: 12px;">
              Check /health and Grafana dashboards for service status.
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>

# Spatio-Temporal Transformer Model Configuration
model:
  model_name: "spatio_temporal_transformer"
  input_dim: 256
  hidden_dim: 256
  num_heads: 8
  num_layers: 6
  dropout: 0.1
  num_atms: 500

  spatial_encoder:
    input_dim: 4
    hidden_dim: 64
    output_dim: 128

  temporal_encoder:
    input_dim: 6
    hidden_dim: 64
    output_dim: 128

  transformer:
    hidden_dim: 256
    num_heads: 8
    num_layers: 6
    dropout: 0.1

  classifier:
    hidden_dim: 128
    output_dim: 500
    dropout: 0.3

training:
  epochs: 50
  batch_size: 32
  learning_rate: 0.0001
  weight_decay: 0.0001
  label_smoothing: 0.1
  gradient_clip: 1.0
  optimizer: "Adam"
  loss: "CrossEntropyLoss"

  early_stopping:
    patience: 15
    min_delta: 0.001
    monitor: "val_loss"

  lr_scheduler:
    type: "ReduceLROnPlateau"
    patience: 5
    factor: 0.5
    min_lr: 1e-7

  checkpoint:
    save_dir: "models/spatio_temporal/checkpoints"
    save_best_only: true
    monitor: "val_accuracy"

  data_split:
    train: 0.8
    val: 0.1
    test: 0.1
    random_seed: 42
